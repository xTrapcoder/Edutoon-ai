# Alembic configuration for edutoon-api.
# The database URL is supplied at runtime by alembic/env.py (from the
# environment / application settings) — never hard-code it here.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

# Zero-padded, ordered revision files: 0001_slug.py, 0002_slug.py, ...
file_template = %%(rev)s_%%(slug)s

# Keep migration history strictly linear.
revision_environment = false

sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format,ruff_lint
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = console_scripts
ruff_lint.entrypoint = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
