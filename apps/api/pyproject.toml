[project]
name = "edutoon-api"
version = "0.1.0"
description = "EduToon AI — API service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "python-multipart",
    "structlog",
    "pyjwt[crypto]>=2.13.0",
    "boto3",
    "pypdf",
    "openai",
    "pgvector",
    "anthropic",
    "piper-tts>=1.3,<2",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "fpdf2",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edutoon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "requires_ffmpeg: needs the real ffmpeg and ffprobe executables (Phase 10 rendering); skipped where they are not installed.",
    "real_auth: the test exercises the real invitation / role / suspended-account logic. Without it, the legacy shim in conftest.py applies: an unknown Clerk identity is provisioned as an administrator and users_repo.create defaults to role admin, so tests written before roles existed keep working. The shim exists only in tests; production has no default role and provisions nobody.",
    "provider_mocked: stands in for an external AI provider (OpenAI / Anthropic) with a fake client, a patched network call or a simulated error. Proves how our code handles a response, never how a real provider behaves.",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["edutoon"]

# boto3/botocore ship no inline types and no stub package is installed;
# confined to providers/storage.py (rule 3), so untyped Any there can't leak
# strict-mode violations into the rest of the codebase.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# piper ships no inline types and no stub package is installed; confined to
# providers/tts.py (rule 3), same reasoning as boto3/botocore above.
[[tool.mypy.overrides]]
module = ["piper.*"]
ignore_missing_imports = true
