name: edutoon

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: edutoon
      POSTGRES_USER: edutoon
      POSTGRES_PASSWORD: edutoon
    ports:
      # Host 5433 -> container 5432: host port 5432 is commonly taken by a
      # native PostgreSQL install on developer machines.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edutoon -d edutoon']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: edutoon
      MINIO_ROOT_PASSWORD: edutoon123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 edutoon edutoon123
        for bucket in edutoon-uploads edutoon-assets edutoon-segments edutoon-outputs; do
          mc mb --ignore-existing "local/$$bucket"
        done
        echo "buckets ready"
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
